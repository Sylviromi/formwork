<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" font-family="monospace" font-size="12"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#4d6b3c"/><rect width="20" height="20" fill="#527240"/></pattern></defs><rect width="640" height="360" fill="url(#g)"/><polygon points="250,120 400,120 430,250 220,250" fill="#4fd1ff" fill-opacity="0.25" stroke="#4fd1ff"/><text x="320" y="190" fill="#e6edf3" font-size="10" text-anchor="middle">ghost</text><rect x="470" y="20" width="160" height="74" fill="#161b22" fill-opacity="0.92" stroke="#30363d"/><text x="478" y="36" fill="#ffd166" font-size="12" text-anchor="start">⚓ Anchored  N</text><text x="478" y="54" fill="#e6edf3" font-size="11" text-anchor="start">offset  2 fwd · 1 down</text><text x="478" y="72" fill="#e6edf3" font-size="11" text-anchor="start">Mode  Place</text><text x="478" y="88" fill="#8b949e" font-size="10" text-anchor="start">H: edit</text><rect x="170" y="282" width="300" height="64" fill="#161b22" fill-opacity="0.92" stroke="#30363d"/><text x="320" y="300" fill="#e6edf3" font-size="11" text-anchor="middle">Hold H + scroll: move forward/back</text><text x="320" y="316" fill="#e6edf3" font-size="11" text-anchor="middle">Hold H + Shift-scroll: up/down</text><text x="320" y="332" fill="#e6edf3" font-size="11" text-anchor="middle">Hold H + R: rotate · H+D: dismantle</text></svg>